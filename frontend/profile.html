<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – Dishcovery</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <script src="theme.js"></script>
</head>
<body>
  <header class="auth-header premium-header">
    <div id="welcomeText">Dishcovery</div>
    <div class="auth-header-actions">
      <button class="auth-header-btn" onclick="window.location.href='index.html'">Search</button>
      <button class="auth-header-btn" onclick="window.location.href='community.html'">Community</button>
      <button class="auth-header-btn" onclick="window.location.href='favorites.html'">Favorites</button>
      <button class="auth-header-btn nav-active">Profile</button>
      <button class="auth-header-btn logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="profile-page">

    <div class="profile-hero-card premium-surface">
      <div class="profile-avatar-lg" id="profileAvatar">?</div>
      <div class="profile-info">
        <p class="card-eyebrow">Your Account</p>
        <h1 class="profile-username" id="profileUsername">Loading...</h1>
        <p class="profile-email" id="profileEmail"></p>
        <div class="profile-stats-row">
          <div class="profile-stat">
            <span class="profile-stat-number" id="statFavorites">—</span>
            <span class="profile-stat-label">Saved Recipes</span>
          </div>
          <div class="profile-stat">
            <span class="profile-stat-number" id="statPosts">—</span>
            <span class="profile-stat-label">Community Posts</span>
          </div>
        </div>
      </div>
    </div>

    <div class="profile-section-card premium-surface">
      <p class="card-eyebrow">Personalize</p>
      <h2 class="profile-section-title">App Theme</h2>
      <p class="profile-section-sub">Pick an accent color — it applies across every page instantly.</p>
      <div class="theme-swatch-row" id="themeSwatches"></div>
    </div>

  </main>

  <script src="profile.js"></script>
</body>
</html>
