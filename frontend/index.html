<!doctype html>
<html>
  <head>
    <title>Constraint-Based Cookbook</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-header">
      <span id="welcomeMsg"></span>
      <div class="auth-header-actions">
        <button class="auth-header-btn" onclick="window.location.href='favorites.html'">⭐ My Favorites</button>
        <button class="auth-header-btn logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="container">
      <h1>Constraint-Based Cookbook</h1>
      <p class="subtitle">
        Find recipes using available ingredients &amp; equipment
      </p>

      <div class="ingredient-input">
        <input type="text" id="ingredient" placeholder="Enter ingredient" />
        <button id="addIngredientBtn">Add Ingredient</button>
      </div>

      <div id="ingredientList" class="ingredient-bubbles"></div>

      <button id="searchBtn">Search Recipes</button>
      <button id="clearBtn">Clear Ingredients</button>

      <div class="filters">
        <p class="filter-title">Select available equipment:</p>

        <div class="pill-group">
          <input type="checkbox" id="eq-oven" class="equip" value="oven" />
          <label for="eq-oven" class="pill">🔥 Oven</label>

          <input type="checkbox" id="eq-micro" class="equip" value="microwave" />
          <label for="eq-micro" class="pill">⚡ Microwave</label>

          <input type="checkbox" id="eq-stove" class="equip" value="stove" />
          <label for="eq-stove" class="pill">🍳 Stove</label>

          <input type="checkbox" id="eq-air" class="equip" value="air fryer" />
          <label for="eq-air" class="pill">🌪️ Air Fryer</label>
        </div>
      </div>

      <div id="results" class="results-grid"></div>

      <footer>Team 8 – CSE 3311-002</footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
