<!doctype html>
<html>
  <head>
    <title>Login – Constraint-Based Cookbook</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Constraint-Based Cookbook</h1>
      <p class="subtitle">Find recipes using available ingredients &amp; equipment</p>

      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Login</button>
          <button class="auth-tab" id="registerTab" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Password" />
          </div>
          <p id="loginError" class="auth-error"></p>
          <button class="auth-submit-btn" onclick="doLogin()">Login</button>
        </div>

        <!-- Register Form -->
        <div id="registerForm" style="display:none;">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="regUsername" placeholder="Choose a username" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Create a password" />
          </div>
          <p id="registerError" class="auth-error"></p>
          <button class="auth-submit-btn" onclick="doRegister()">Create Account</button>
        </div>
      </div>

      <footer>Team 8 – CSE 3311-002</footer>
    </div>

    <script src="login.js"></script>
  </body>
</html>
