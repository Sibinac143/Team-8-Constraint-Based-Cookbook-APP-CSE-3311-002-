<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Details</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <header class="auth-header premium-header">
    <div>Constraint-Based Cookbook</div>
    <div class="auth-header-actions">
      <button class="auth-header-btn" onclick="goBackHome()">Back to Search</button>
      <button class="auth-header-btn" onclick="window.location.href='favorites.html'">Favorites</button>
    </div>
  </header>

  <main class="recipe-page-premium">
    <section id="recipeHero" class="recipe-hero-card premium-surface">
      <div class="recipe-loading-card">
        <p>Loading recipe...</p>
      </div>
    </section>

    <section id="recipeBody" class="recipe-body-grid" style="display:none;">
      <aside class="recipe-sidebar">
        <div class="recipe-side-card premium-surface">
          <p class="card-eyebrow">Match Overview</p>
          <h3>Why this recipe fits</h3>
          <div id="matchSummary" class="match-summary-list"></div>
        </div>

        <div class="recipe-side-card premium-surface">
          <p class="card-eyebrow">Your Ingredients</p>
          <h3>Missing ingredients</h3>
          <div id="missingIngredients" class="missing-ingredients-list"></div>
        </div>
      </aside>

      <section class="recipe-main-content">
        <div class="recipe-content-card premium-surface">
          <div class="recipe-section-header">
            <div>
              <p class="card-eyebrow">Ingredients</p>
              <h2>What you need</h2>
            </div>
          </div>
          <div id="ingredientsList" class="premium-ingredients-grid"></div>
        </div>

        <div class="recipe-content-card premium-surface">
          <div class="recipe-section-header">
            <div>
              <p class="card-eyebrow">Instructions</p>
              <h2>How to make it</h2>
            </div>
          </div>
          <div id="instructionsList" class="premium-steps-list"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="recipe.js"></script>
</body>
</html>
