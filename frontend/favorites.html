<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Recipes – Dishcovery</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <header class="auth-header premium-header">
    <div id="welcomeMsg">Dishcovery</div>
    <div class="auth-header-actions">
      <button class="auth-header-btn" onclick="window.location.href='index.html'">Search</button>
      <button class="auth-header-btn" onclick="window.location.href='community.html'">Community</button>
      <button class="auth-header-btn" onclick="window.location.href='cookbot.html'">CookBot</button>
      <button class="auth-header-btn logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="homepage-premium">
    <section class="results-section-clean">
      <div class="feed-header-block">
        <p class="card-eyebrow">Saved Recipes</p>
        <h1>My Favorites</h1>
        <p class="feed-section-subtitle">
          Recipes you’ve saved to revisit later.
        </p>
      </div>

      <div id="favorites" class="results-grid"></div>

      <div class="section-link-row">
        <a class="section-link-btn" href="index.html">Back to recipe search</a>
      </div>
    </section>
  </main>

  <script src="favorites.js"></script>
</body>
</html>
